# Netlify serves only the frontend, so the protections nginx gives the local
# stack are repeated here. The build needs SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
# and BACKEND_URL.

# The build writes dist/_redirects with a same-origin proxy to the backend: the
# browser never calls another site, so the API needs no CORS rules. Netlify reads
# _redirects first, so that rule stays ahead of the page fallback below.
[build]
  command = "npm ci && npm run build && node scripts/write-redirects.mjs"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
