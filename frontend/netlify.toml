# Netlify serves only the frontend, so the protections nginx gives the local
# stack are repeated here. Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in
# Netlify's environment settings. Replace the API host below before deploying.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

# Same-origin proxy to the backend: the browser never calls another site, so the
# API needs no CORS rules. A rule with force stays ahead of the page fallback.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-BACKEND-HOST/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
