server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;

    # Repeated in each location that sets its own headers, because nginx does
    # not inherit add_header. Inline styles are needed by the sandboxed report.
    # netlify.toml carries the same policy for the hosted site.
    set $csp "default-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";

    location /api/ {
        proxy_pass http://agent:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
